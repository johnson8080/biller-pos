<script>
  // Paint the saved palette, light/dark choice and text size before the
  // stylesheet loads, so a cold start never flashes the default Forest theme.
  try {
    var auth = JSON.parse(localStorage.getItem("biller.pos.auth") || "null");
    var raw = (auth && auth.uid && localStorage.getItem("biller.pos.shop." + auth.uid)) || localStorage.getItem("biller.pos.v1");
    var savedTheme = JSON.parse(raw || "null");
    var store = savedTheme && savedTheme.store;
    if (store) {
      if (["forest", "ocean", "clay", "plum", "black"].indexOf(store.theme) >= 0) {
        document.documentElement.setAttribute("data-theme", store.theme);
      }
      if (store.colorScheme === "dark" || store.colorScheme === "light") {
        document.documentElement.setAttribute("data-color-scheme", store.colorScheme);
      }
      if (["small", "medium", "large"].indexOf(store.textSize) >= 0) {
        document.documentElement.setAttribute("data-text-size", store.textSize);
      }
    }
  } catch (e) {}
</script>

<script>
  /* Pull-to-refresh — a progressive bar fills right below the hero bar as
     you drag, the hero stays fixed while the page content slides down, and
     past the threshold the app reloads with a cache-busting timestamp, then
     shows a green "Refreshed!" toast so new designs land without clearing
     the cache. */
  (() => {
    const THRESH = 64;    // raw drag distance (px) that fills the bar
    const MAX_Y = 96;     // farthest the content slides down
    const HOLD_MS = 420;  // how long the green bar holds before reloading
    const app = document.getElementById("app");
    const vp = document.getElementById("viewport");
    const layers = document.getElementById("layers");
    if (!app || !vp) return;

    const bar = document.createElement("div");
    bar.className = "ptr-bar";
    bar.setAttribute("aria-hidden", "true");
    app.prepend(bar);

    // The bar sits right below the hero bar (the viewport's top edge), so it
    // stays visible and pinned under the hero for the whole pull.
    const place = () => { bar.style.top = vp.offsetTop + "px"; };
    place();
    window.addEventListener("resize", place, { passive: true });
    window.addEventListener("orientationchange", place, { passive: true });

    let sy = 0, sx = 0, armed = false, pulling = false, locked = false;
    let lastDy = 0, raf = 0;

    const damp = (d) => Math.min(d / (1 + d / 260), MAX_Y);
    const setBar = (pct, ready) => {
      bar.style.width = (pct * 100).toFixed(1) + "%";
      bar.classList.toggle("is-ready", !!ready);
    };
    const stopFrame = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };
    const frame = () => {
      raf = 0;
      const d = lastDy;
      if (d <= 0) { setBar(0, false); vp.style.transform = ""; return; }
      setBar(Math.min(d / THRESH, 1), d >= THRESH);
      vp.style.transform = "translateY(" + damp(d).toFixed(1) + "px)";
    };
    const settle = () => {
      pulling = false;
      lastDy = 0;
      stopFrame();
      vp.classList.remove("is-pulling");
      vp.classList.add("ptr-settle");
      vp.style.transform = "";
      bar.classList.add("is-releasing");   // ease the bar back instead of a snap
      setBar(0, false);
      bar.classList.remove("is-active");
      setTimeout(() => {
        vp.classList.remove("ptr-settle");
        bar.classList.remove("is-releasing");
      }, 320);
    };

    document.addEventListener("touchstart", (e) => {
      if (locked || armed) return;
      if (!e.touches || e.touches.length !== 1) return;
      if (vp.scrollTop > 0 || window.scrollY > 0) return;
      if (layers && layers.childElementCount) return;   // a sheet or modal is open
      place();                                          // hero height differs per screen
      armed = true;
      sy = e.touches[0].clientY;
      sx = e.touches[0].clientX;
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (!armed || locked) return;
      const t = e.touches[0];
      const dy = t.clientY - sy;
      const dx = t.clientX - sx;

      if (!pulling) {
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 12) { armed = false; return; }
        if (dy < 8) return;                             // wait for a clear downward drag
        pulling = true;
        lastDy = 0;
        vp.classList.add("is-pulling");
        bar.classList.add("is-active");
      }
      if (dy <= 0) { lastDy = 0; if (!raf) raf = requestAnimationFrame(frame); return; }
      e.preventDefault();                               // no native overscroll while pulling
      lastDy = dy;
      if (!raf) raf = requestAnimationFrame(frame);     // one update per frame = smooth
    }, { passive: false });

    const release = () => {
      if (!armed) return;
      armed = false;
      stopFrame();
      if (!pulling) return;
      if (lastDy >= THRESH) {
        locked = true;                                  // hold the green bar while reloading
        bar.classList.add("is-loading");
        vp.classList.add("ptr-settle");
        vp.style.transform = "translateY(" + damp(THRESH).toFixed(1) + "px)";
        try { T.vibrate && T.vibrate(18); } catch (err) {}
        try { localStorage.setItem("biller.pos.ptr", String(Date.now())); } catch (err) {}
        setTimeout(() => {
          const u = new URL(location.href);
          u.searchParams.set("t", Date.now());
          location.replace(u.href);                     // no history entry for the reload
        }, HOLD_MS);
      } else {
        settle();
      }
    };
    const cancelNow = () => {
      if (!armed) return;
      armed = false;
      if (pulling) settle();
    };
    document.addEventListener("touchend", release);
    document.addEventListener("touchcancel", cancelNow);

    // After a cache-bust reload: green "Refreshed!" toast, then clean up.
    // The localStorage flag keeps the toast working even if the ?t= parameter
    // is lost on the way; ?t= itself is what bypasses the cached shell.
    let fresh = false;
    try {
      const ts = Number(localStorage.getItem("biller.pos.ptr") || 0);
      if (ts && Date.now() - ts < 15000) {
        fresh = true;
        localStorage.removeItem("biller.pos.ptr");
      }
    } catch (err) {}
    const q = new URLSearchParams(location.search);
    if (fresh || q.has("t")) {
      let tries = 0;
      (function show() {
        const el = document.getElementById("toast");
        if (window.T && T.toast && el) {
          T.toast("Refreshed!", "i-check");
          el.classList.add("is-green");
          setTimeout(() => el.classList.remove("is-green"), 2300);
          try {
            const u = new URL(location.href);
            u.searchParams.delete("t");
            history.replaceState(null, "", u.pathname + u.search + u.hash);
          } catch (err) {}
        } else if (tries++ < 40) {
          setTimeout(show, 120);                        // wait for core.js (deferred)
        }
      })();
    }
  })();
</script>
